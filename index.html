<!DOCTYPE html>
<html lang="es">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Radios</title>
		<link rel="stylesheet" type="text/css" href="radios.css">
	</head>
	<body>
		<main class="player">
			<header class="page-header">
				<span class="eyebrow">TU ESPACIO DE AUDIO</span>
				<h1>Radio en vivo</h1>
				<p>Elige tu estación y disfruta el momento.</p>
			</header>

			<section class="station-card" aria-label="Reproductor de radio">
				<label class="section-label" for="selector">ESTACIÓN</label>
				<select id="selector" onchange="tune(value)">
					<option value="https://server6.globalhostla.com:9308/stream">Cardenales 92.1FM</option>
					<option value="https://acp2.lorini.net:30008/radioestadio.aac">Radio Estadio</option>
					<option value="https://streamtv.intervenhosting.net:3330/live/sabrosafmlive.m3u8">Sabrosa (no ajusta)</option>
					<option value="https://radiostream2.interven.ca/listen/durisimafm/radio.mp3">Durísima 104.9FM</option>
					<option value="https://redradioypc.com:8000/stream">Eneal 104.1FM</option>
					<option value="https://server6.globalhostla.com:9278/stream">Más Network</option>
					<option value="https://backend.anii.io/api/a/aler.org:8000/barquisimeto.aac">Fe y Alegría</option>
					<option value="https://stream.zeno.fm/2ca9cavana0uv">Lider</option>
					<option value="https://server6.globalhostla.com:9356/stream">Fama</option>
					<option value="https://servers58.com/proxy/tuvozestereo/stream">Tu Voz Estereo</option>
					<option value="https://cdn-peer012.streaming-pro.com:8131/malagafmmobile">Marca Radio</option>
					<option value="https://flucast04-o-cloud.flumotion.com/cope/net1.mp3">COPE</option>
					<option value="https://libertaddigital-radio-live1.flumotion.com/libertaddigital/ld-live1-med.aac">ES Radio</option>
					<option value="https://dreamsiteradiocp2.com">Radio María España</option>
					<option value="https://server6.globalhostla.com:9016/stream">Otra</option>
				</select>

				<audio id="miaudio" controls><source src="https://server6.globalhostla.com:9308/stream" type="audio/mpeg"></audio>
			</section>

			<section class="controls-card" aria-label="Controles de ajuste">
				<div class="delta-display">
					<span class="section-label">AJUSTE DE STREAMING</span>
					<span class="time-value"><span id="delta">0:00</span></span>
				</div>
				<div class="seek-controls" aria-label="Ajustar el tiempo">
					<button class="t" onclick="seek(-30)">-30</button>
					<button class="t" onclick="seek(-5)">-5</button>
					<button class="t" onclick="seek(-1)">-1</button>
					<button class="t" onclick="seek(-0.5)">-½</button>
					<button class="t" onclick="seek(-0.25)">-¼</button>
					<button class="t" onclick="seek(0.25)">+¼</button>
					<button class="t" onclick="seek(0.5)">+½</button>
					<button class="t" onclick="seek(1)">+1</button>
					<button class="t" onclick="seek(5)">+5</button>
					<button class="t" onclick="seek(30)">+30</button>
				</div>
			</section>

			<section class="timer-card" aria-label="Cronómetro">
				<span class="timer-icon" aria-hidden="true">⏱</span>
				<div class="timer-copy">
					<span class="section-label">CRONÓMETRO</span>
					<span id="cronom" class="time-value">0:00</span>
				</div>
				<button class="t timer-button" id="crono" onclick="cronometro()" aria-label="Iniciar, detener o reiniciar cronómetro">▶</button>
			</section>
		</main>

		<script src="radios.js"></script>

	</body>
</html>
